[project]
name = "biohub-ops-portal"
version = "0.1.0"
description = "Download and inspect subsets of the CZ Biohub OPS data portal"
requires-python = ">=3.11"
dependencies = [
    "zarr>=3.1",
    "s3fs>=2024.6",
    "boto3>=1.34",
    "click>=8.1",
    "numpy>=2.0",
]

[project.optional-dependencies]
tables = [
    "anndata>=0.10",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
]
portal-cli = [
    "biohub-data-cli>=0.4",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
